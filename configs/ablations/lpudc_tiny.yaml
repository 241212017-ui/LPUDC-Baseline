# Tiny synthetic config — used by automated tests / overfit sanity checks.
# NOT a paper reproduction configuration.

experiment:
  name: lpudc_tiny
  output_dir: results/lpudc_tiny
  checkpoint_dir: checkpoints/lpudc_tiny
  log_dir: logs/lpudc_tiny
  seed: 0
  device: cpu

dataset:
  name: synthetic_tiny
  root: data/synthetic_tiny
  degraded_dirname: degraded
  gt_dirname: gt
  image_size: null
  crop_size: 64
  random_crop: false
  strict: true
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5

model:
  pyramid_levels: 3
  in_channels: 3
  lf_base_channels: 16
  lf_encoder_channels: [16, 32, 64]
  lf_stem_drb_count: 1
  lf_stem_dilations: [1, 2]
  lf_guidance_channels: 32
  dgf_kernel_size: 3
  dgf_eps: 0.001
  dgf_coeff_channels: 16
  hf_base_channels: 16
  hf_unshuffle_factor: 2
  hf_pre_drb_count: 1
  hf_pre_drb_dilations: [1, 2]
  hf_hrnet_drb_count: 2
  hf_hrnet_drb_dilations: [1, 2]
  fusion_mode: 2
  debug_shapes: true

loss:
  pyramid_weight: 0.5
  use_pyramid_loss: true
  reduction: mean

training:
  batch_size: 1
  iterations: 200
  num_workers: 0
  log_interval: 10
  val_interval: 50
  save_interval: 100
  vis_interval: 100
  grad_clip: 1.0
  amp: false
  gradient_accumulation: 1
  gradient_checkpointing: false
  resume: null

optimization:
  optimizer: adam
  beta1: 0.9
  beta2: 0.999
  lr: 0.001
  min_lr: 0.000001
  weight_decay: 0.0
  scheduler: cosine_annealing

evaluation:
  metrics: [PSNR, SSIM]
  lpips_net: alex
  enable_lpips: false
  enable_dists: false
  save_visualizations: true
  max_vis_images: 4
